services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_local
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Bogota
      - TZ=America/Bogota
      - WEBHOOK_URL=${WEBHOOK_URL:?Define WEBHOOK_URL en el archivo .env}
      # Permite iniciar sesion por http:// desde otro equipo de la red local.
      # Quitala si algun dia usas HTTPS propio.
      - N8N_SECURE_COOKIE=false
    volumes:
      - ${N8N_DATA_DIR:?Define N8N_DATA_DIR en el archivo .env}:/home/node/.n8n